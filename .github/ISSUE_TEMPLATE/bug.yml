name: Bug report
description: Something in Bellwether is broken or looks wrong.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by the Report a problem button in Settings. Edit or remove anything you don't want to share.
      render: markdown
